[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-tools"
version = "0.1.2"
description = "A shared AI toolbox package."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Mezni", email = "mamezni@gmail.com" }
]
dependencies = [
    "anthropic>=0.30.0",
    "google-genai>=1.0.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "tenacity>=8.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["config", "core", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
